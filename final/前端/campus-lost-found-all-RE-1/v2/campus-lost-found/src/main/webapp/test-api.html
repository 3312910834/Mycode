<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>API测试页面</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .test-section { 
            border: 1px solid #ddd; 
            padding: 20px; 
            margin: 20px 0; 
            border-radius: 5px; 
            background: #f9f9f9;
        }
        input, button {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        .result {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>用户API测试</h1>
    
    <!-- 注册测试 -->
    <div class="test-section">
        <h3>1. 用户注册</h3>
        <form onsubmit="testRegister(event)">
            用户名: <input type="text" id="reg-username" value="user_test"><br>
            密码: <input type="password" id="reg-password" value="123456"><br>
            手机号: <input type="text" id="reg-phone" value="13888888888"><br>
            <button type="submit">测试注册</button>
        </form>
        <div class="result" id="register-result"></div>
    </div>
    
    <!-- 登录测试 -->
    <div class="test-section">
        <h3>2. 用户登录</h3>
        <form onsubmit="testLogin(event)">
            用户名: <input type="text" id="login-username" value="admin"><br>
            密码: <input type="password" id="login-password" value="admin123"><br>
            <button type="submit">测试登录</button>
        </form>
        <div class="result" id="login-result"></div>
    </div>
    
    <!-- 获取用户信息 -->
    <div class="test-section">
        <h3>3. 获取用户信息</h3>
        <form onsubmit="testGetInfo(event)">
            用户ID: <input type="text" id="info-id" value="1"><br>
            <button type="submit">获取信息</button>
        </form>
        <div class="result" id="info-result"></div>
    </div>
    
    <script>
        // 基础URL
        const baseUrl = '/campus-lost-found/api/user';
        
        // 测试注册
        async function testRegister(event) {
            event.preventDefault();
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const phone = document.getElementById('reg-phone').value;
            
            const params = new URLSearchParams({
                username: username,
                password: password,
                phone: phone
            });
            
            try {
                const response = await fetch(baseUrl + '/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: params
                });
                const result = await response.json();
                document.getElementById('register-result').innerHTML = 
                    JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('register-result').innerHTML = 
                    '请求失败: ' + error;
            }
        }
        
        // 测试登录
        async function testLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            const params = new URLSearchParams({
                username: username,
                password: password
            });
            
            try {
                const response = await fetch(baseUrl + '/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: params
                });
                const result = await response.json();
                document.getElementById('login-result').innerHTML = 
                    JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('login-result').innerHTML = 
                    '请求失败: ' + error;
            }
        }
        
        // 测试获取用户信息
        async function testGetInfo(event) {
            event.preventDefault();
            const userId = document.getElementById('info-id').value;
            
            try {
                const response = await fetch(baseUrl + '/info?id=' + userId);
                const result = await response.json();
                document.getElementById('info-result').innerHTML = 
                    JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('info-result').innerHTML = 
                    '请求失败: ' + error;
            }
        }
    </script>
</body>
</html>
